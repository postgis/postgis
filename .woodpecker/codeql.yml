labels:
  platform: linux/amd64
when:
  event: [push, pull_request, tag]

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false

steps:
  analyze:
    image: repo.osgeo.org/postgis/build-test:debian13
    pull: true
    commands:
      - export CODEQL_TMP="$${CI_WORKSPACE}/.tmp/codeql"
      - export CODEQL_HOME="$${CODEQL_TMP}/codeql"
      - export CODEQL_DB="$${CODEQL_TMP}/db"
      - export CODEQL_SARIF="$${CODEQL_TMP}/postgis-codeql.sarif"
      - mkdir -p "$${CODEQL_TMP}"
      - >-
        curl -fsSL https://github.com/github/codeql-action/releases/latest/download/codeql-bundle-linux64.tar.gz
        | tar -xz -C "$${CODEQL_TMP}"
      - >-
        "$${CODEQL_HOME}/codeql" version
      - ./autogen.sh
      - >-
        "$${CODEQL_HOME}/codeql" database create "$${CODEQL_DB}"
        --language=cpp
        --source-root="$${CI_WORKSPACE}"
        --command=ci/dronie/codeql_build.sh
      - >-
        "$${CODEQL_HOME}/codeql" database analyze "$${CODEQL_DB}"
        cpp-security-and-quality.qls
        --format=sarif-latest
        --output="$${CODEQL_SARIF}"
      - >-
        python3 -c 'import json, os; p=os.environ["CODEQL_SARIF"]; d=json.load(open(p)); rs=sum(len(r.get("results", [])) for r in d.get("runs", [])); print(f"CodeQL SARIF: {p} ({rs} results)")'
