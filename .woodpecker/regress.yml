when:
  event: [push, pull_request, tag]
variables:
  test-image: &test-image repo.osgeo.org/postgis/build-test:trisquel3
  steps-env: &steps-env
    - export PATH=/usr/lib/postgresql/$${PGVER}/bin:$${PATH}
    - export PGPORT=$$(grep ^port /etc/postgresql/$${PGVER}/main/postgresql.conf | awk '{print $$3}')
    # The test image can need crash recovery after clone-local startup. Under
    # multi-workflow I/O load, Debian's default 60-second pg_ctl wait is short.
    - printf '%s\n' "pg_ctl_options = '-t 300'" > /etc/postgresql/$${PGVER}/main/pg_ctl.conf
    - install -d /etc/postgresql/$${PGVER}/main/conf.d
    - printf '%s\n' "fsync = off" "full_page_writes = off" "synchronous_commit = off" > /etc/postgresql/$${PGVER}/main/conf.d/postgis-ci-durability.conf
    - export SRCDIR=$${CI_WORKSPACE}
    - export RUNTESTFLAGS="-v
      --after-create-db-script $${SRCDIR}/regress/hooks/standard-conforming-strings-off.sql"
    - export BUILDDIR=$${SRCDIR}/build/pg$${PGVER}
    - export CURRENTVERSION=$$(grep '^POSTGIS_' $${SRCDIR}/Version.config | cut -d= -f2 | paste -sd '.')
    - pg_config --version
  steps-start-postgresql: &steps-start-postgresql
    - service postgresql start $${PGVER}
    - psql -c 'select version()' template1
  steps-pg-build: &steps-pg-build
    - mkdir -p "$${BUILDDIR}"
    - cd "$${BUILDDIR}"
    - $${SRCDIR}/configure
      --with-library-minor-version
      --enable-lto
      --enable-lto
      CFLAGS="-O2 -Wall -fno-omit-frame-pointer -Werror"
    # Matrix jobs provide the parallelism. Keep each build serial: the PostGIS
    # make graph can otherwise race generated protobuf headers.
    - make -j1
  steps-pg-test-preinstall: &steps-pg-test-preinstall
    - cd build/pg$${PGVER}
    - make check
  steps-pg-install: &steps-pg-install
    - make -C build/pg$${PGVER} install
  steps-pg-test-install: &steps-pg-test-install
    - service postgresql start $${PGVER}
    - make -C build/pg$${PGVER} installcheck
  steps-pg-test-all-upgrades: &steps-pg-test-all-upgrades
    - cd build/pg$${PGVER}
    - mkfifo check.fifo
    - tee check.log < check.fifo &
    - $${SRCDIR}/utils/check_all_upgrades.sh -s $${CURRENTVERSION}! > check.fifo
    - wait # for tee process to flush its buffers
    - echo "-- Summary of upgrade tests --"
    - egrep '(PASS|FAIL|SKIP|INFO|ERROR)' check.log

clone:
  git:
    image: woodpeckerci/plugin-git
    depth: 50

steps:
  autogen:
    image: *test-image
    pull: true
    commands:
      - ./autogen.sh

  build:
    image: *test-image
    depends_on: autogen
    commands:
      - <<: *steps-env
      - <<: *steps-pg-build

  test-preinstall:
    image: *test-image
    depends_on: build
    when:
      - matrix:
          REGRESS_SUITE: preinstall
    commands:
      - <<: *steps-env
      - <<: *steps-start-postgresql
      - <<: *steps-pg-test-preinstall

  test-install:
    image: *test-image
    depends_on: build
    when:
      - matrix:
          REGRESS_SUITE: install
    commands:
      - <<: *steps-env
      - <<: *steps-start-postgresql
      - <<: *steps-pg-install
      - <<: *steps-pg-test-install

  test-upgrades:
    image: *test-image
    depends_on: build
    when:
      - matrix:
          REGRESS_SUITE: extension-upgrade
    commands:
      - <<: *steps-env
      - <<: *steps-start-postgresql
      - make -C "$${BUILDDIR}" staged-install
      - <<: *steps-pg-install
      - <<: *steps-pg-test-all-upgrades

# Each matrix entry is an independent Woodpecker workflow with its own clone,
# build tree, PostgreSQL instance, and five-hour runner deadline. The entries
# below preserve the previous stable-3.4 coverage units while removing the
# single serial regress workflow that could not finish inside the deadline.
matrix:
  include:
    - PGVER: "12"
      REGRESS_SUITE: preinstall
    - PGVER: "15"
      REGRESS_SUITE: preinstall
    - PGVER: "12"
      REGRESS_SUITE: install
    - PGVER: "15"
      REGRESS_SUITE: install
    - PGVER: "12"
      REGRESS_SUITE: extension-upgrade
    - PGVER: "15"
      REGRESS_SUITE: extension-upgrade
