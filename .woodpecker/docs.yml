labels:
  platform: linux/amd64
when:
  event: [push, pull_request, tag]
variables:
  - &test_image 'repo.osgeo.org/postgis/build-test:debian13'
  - common_doc_paths: &common_doc_paths
      # related config files
      - ".woodpecker/docs.yml"
      # Makefiles
      - "doc/Makefile.in"
      - "doc/html/images/Makefile.in"
      - "regress/Makefile.in"
      # XML sources
      - "doc/*.xml"
      - "doc/xsl/*.xsl"
      - "doc/html/*.js"
      - "doc/html/*.css"
      # Build-time geometry renderer
      - "utils/docs/postgis_exampletest.py"
      - "utils/docs/tests/test_postgis_exampletest.py"
      - "liblwgeom/lwout_svg.c"
      - "liblwgeom/cunit/cu_out_svg.c"
      # Internationalization Makefiles
      - "doc/po/Makefile.local"
  - &when_path
      include:
        - <<: *common_doc_paths
  - &when_path_full
      include:
        - <<: *common_doc_paths
        # Any localized assets
        - "doc/po/*/Makefile.in"
        - "doc/po/*/*.po"
  # Every localized step shares this one filter on purpose. The localized steps are
  # chained to each other to cap memory (see the generated section below), and
  # Woodpecker rejects a whole pipeline when an included step depends on a step that
  # its conditions filtered out. Per-language filters made that happen on every
  # single-language translation commit, so the languages must be included or
  # excluded together.
  - &when_localized
      include:
        - "doc/po/*/Makefile.in"
        - "doc/po/*/*.po"

steps:
  prepare:
    image: *test_image
    pull: true
    commands:
      - ./autogen.sh
      - mkdir -p build-docs && cd build-docs
      - ../configure --with-pgconfig=/usr/lib/postgresql/18/bin/pg_config --without-protobuf --without-raster
      - make postgis_revision.h
      - . ../ci/parallel-jobs.sh
      - export POSTGIS_BUILD_JOBS=$$(postgis_ci_parallel_jobs)
      - make -j"$${POSTGIS_BUILD_JOBS}" SUBDIRS="deps liblwgeom libpgcommon postgis"
      - xmllint --version

  render-visual-examples:
    image: *test_image
    pull: true
    depends_on: prepare
    commands:
      - export PATH=/usr/lib/postgresql/18/bin:$${PATH}
      - export PGROOT=$$(mktemp -d)
      - chown postgres:postgres "$${PGROOT}"
      - export PGDATA="$${PGROOT}/data" PGHOST="$${PGROOT}/socket" PGUSER=postgres
      - runuser -u postgres -- mkdir "$${PGDATA}" "$${PGHOST}"
      - runuser -u postgres -- initdb -D "$${PGDATA}" -A trust --no-sync --no-data-checksums
      - >-
        runuser -u postgres -- pg_ctl -D "$${PGDATA}"
        -l "$${PGROOT}/postgresql.log"
        -o "-F -h '' -k $${PGHOST} -c synchronous_commit=off -c full_page_writes=off"
        -w start
      - trap 'runuser -u postgres -- pg_ctl -D "$${PGDATA}" -m fast -w stop || true' EXIT
      - make -C build-docs/regress visual-examples

  check-xml:
    image: *test_image
    pull: true
    depends_on: render-visual-examples
    commands:
      - make -C build-docs/doc check
    when:
      - path: *when_path_full
  build-images:
    image: *test_image
    pull: true
    depends_on: render-visual-examples
    commands:
      - make -C build-docs/doc images
    when:
      - path: *when_path_full
  build-html:
    image: *test_image
    pull: true
    depends_on: [ check-xml, render-visual-examples ]
    commands:
      - make -C build-docs/doc html
    when:
      - path: *when_path
  build-cheatsheets:
    image: *test_image
    pull: true
    depends_on: check-xml
    commands:
      - make -C build-docs/doc/ cheatsheets
    when:
      - path: *when_path_full
  build-chunked-html:
    image: *test_image
    pull: true
    depends_on: [ check-xml, render-visual-examples ]
    commands:
      - make -C build-docs/doc html
    when:
      - path: *when_path
  build-pdf:
    image: *test_image
    pull: true
    depends_on: [ build-images, check-xml ]
    commands:
      - apt-get update
      # Install librsvg2-bin here because the PDF target renders SVG assets during this step.
      - apt-get install -y --no-install-recommends librsvg2-bin
      - rm -rf /var/lib/apt/lists/*
      - make -C build-docs/doc/ pdf
    when:
      - path: *when_path

  # DO NOT EDIT PAST THIS LINE, use update-docs-localized.sh to update #
### TARGET check-xml
  # Localized check-xml steps are intentionally chained to cap memory per step; this is a memory-control
  # measure, not a dependency between languages. Breaking the chain restores the fan-out that caused the kills.
  # The chain is why every localized step carries the same when_localized filter: Woodpecker refuses a whole
  # pipeline when an included step depends on one its conditions filtered out, so the languages are included
  # or excluded together. Per-language filters broke every single-language translation commit.
  check-xml-it_IT:
    image: *test_image
    pull: true
    commands:
      - make -C build-docs/doc/po/it_IT local-check-xml
    depends_on: prepare
    when:
      - path: *when_localized

  check-xml-pt_BR:
