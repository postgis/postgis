name: MSYS2
on:
  push:
  pull_request: ~

jobs:
  mingw:
    name: mingw
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟦', sys: mingw64 }
          - { icon: '🟨', sys: ucrt64  } # Experimental!
          - { icon: '🟧', sys: clang64 } # Experimental!
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # see https://github.com/msys2/setup-msys2
    - name: checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 50
    - name: Check changed surface
      id: changed-surface
      shell: bash
      run: |
        set +e
        python3 ci/ci_need_suite.py github-ci
        gate_status=$?
        set -e
        if test "${gate_status}" = 78; then
          echo "skip=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        exit "${gate_status}"
    - name: '${{ matrix.icon }} Setup MSYS2'
      if: steps.changed-surface.outputs.skip != 'true'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          git
          make
          bison
        pacboy: >-
          toolchain:p
          autotools:p
          geos:p
          proj:p
          gdal:p
          sfcgal:p
          json-c:p
          cunit:p
          gettext:p
          libxml2:p
          postgresql:p

    - name: '🚧 Build TOOL'
      if: steps.changed-surface.outputs.skip != 'true'
      run: |
        MSYSTEM= /${{ matrix.sys }}/bin/initdb -D D:/a/_tmp/psql
        MSYSTEM= /${{ matrix.sys }}/bin/pg_ctl -D D:/a/_tmp/psql -l logfile start
        MSYSTEM= /${{ matrix.sys }}/bin/pg_ctl register -N "postgresql" -U "NT AUTHORITY\NetworkService" -D D:/a/_tmp/psql -w -S demand
        MSYSTEM= /${{ matrix.sys }}/bin/createuser -U `whoami` -s postgres
        MSYSTEM= ./autogen.sh
        MSYSTEM= ./configure --with-pgconfig=/${{ matrix.sys }}/bin/pg_config --without-protobuf
        MSYSTEM= make
        MSYSTEM= PGIS_REG_TMPDIR=D:/a/_tmp/pgis_reg make check || {
          status=$?
          echo "::group::Regression diffs"
          for f in /d/a/_tmp/pgis_reg/test_*_diff; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            sed -n '1,400p' "$f"
          done
          echo "::endgroup::"
          exit "$status"
        }
